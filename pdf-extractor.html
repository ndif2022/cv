<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrai pagine PDF</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }

    /* ── Drop zone ─────────────────────────────────────────── */
    #drop-zone {
      width: 100%;
      max-width: 680px;
      border: 2px dashed #334155;
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #1e293b;
    }
    #drop-zone:hover, #drop-zone.drag-over { border-color: #6366f1; }
    #drop-zone svg { opacity: 0.5; margin-bottom: 1rem; }
    #drop-zone p { color: #94a3b8; font-size: 0.95rem; }
    #drop-zone strong { color: #c7d2fe; }
    #file-input { display: none; }

    /* ── Main layout ───────────────────────────────────────── */
    #main {
      display: none;
      width: 100%;
      max-width: 1200px;
      margin-top: 1.5rem;
      gap: 1.25rem;
      align-items: flex-start;
    }
    #main.visible { display: flex; }

    /* ── TOC sidebar ───────────────────────────────────────── */
    #toc-panel {
      width: 280px;
      flex-shrink: 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      display: flex;
      flex-direction: column;
    }

    #toc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    #toc-header h2 { font-size: 0.85rem; font-weight: 700; color: #a5b4fc; letter-spacing: 0.05em; text-transform: uppercase; }

    #toc-search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    #toc-search input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      outline: none;
    }
    #toc-search input:focus { border-color: #6366f1; }

    #toc-empty {
      padding: 1.5rem 1rem;
      font-size: 0.82rem;
      color: #475569;
      text-align: center;
      line-height: 1.6;
    }

    #toc-list {
      overflow-y: auto;
      flex: 1;
      padding: 0.5rem 0;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .toc-btn {
      flex: 1;
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.8rem;
      text-align: left;
      padding: 0.45rem 1rem 0.45rem 0;
      cursor: pointer;
      border-radius: 0;
      font-weight: 400;
      line-height: 1.4;
      transition: color 0.15s, background 0.15s;
    }
    .toc-btn:hover { color: #a5b4fc; background: #0f111780; }
    .toc-btn.active { color: #818cf8; font-weight: 600; }

    .toc-select-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 0.3rem 0.75rem 0.3rem 0.25rem;
      cursor: pointer;
      font-size: 0.72rem;
      color: #475569;
      border-radius: 6px;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .toc-select-btn:hover { color: #6366f1; }

    .toc-item.depth-0 .toc-btn { padding-left: 1rem; font-weight: 600; color: #e2e8f0; font-size: 0.82rem; }
    .toc-item.depth-1 .toc-btn { padding-left: 1.75rem; }
    .toc-item.depth-2 .toc-btn { padding-left: 2.5rem; font-size: 0.76rem; color: #94a3b8; }
    .toc-item.depth-3 .toc-btn { padding-left: 3.25rem; font-size: 0.74rem; color: #64748b; }

    .toc-page-badge {
      flex-shrink: 0;
      font-size: 0.68rem;
      color: #475569;
      margin-right: 0.25rem;
    }

    /* ── Right column ──────────────────────────────────────── */
    #right-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Toolbar ───────────────────────────────────────────── */
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    #file-name {
      flex: 1;
      min-width: 120px;
      font-size: 0.82rem;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jump-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
    .jump-wrap label { color: #94a3b8; white-space: nowrap; }
    .jump-wrap input {
      width: 60px;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.8rem;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: #0f1117;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-ghost:hover:not(:disabled) { border-color: #6366f1; color: #c7d2fe; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .btn-danger {
      background: #0f1117;
      color: #f87171;
      border: 1px solid #334155;
    }
    .btn-danger:hover:not(:disabled) { border-color: #f87171; }

    #sel-count {
      font-size: 0.8rem;
      color: #6366f1;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── Page grid ─────────────────────────────────────────── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.85rem;
    }

    .page-card {
      position: relative;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      user-select: none;
    }
    .page-card:hover { border-color: #6366f1; transform: translateY(-2px); }
    .page-card.selected { border-color: #6366f1; box-shadow: 0 0 0 2px #6366f133; }
    .page-card canvas { display: block; width: 100%; }
    .page-label {
      text-align: center;
      font-size: 0.68rem;
      color: #64748b;
      padding: 0.3rem;
    }
    .page-card.selected .page-label { color: #a5b4fc; }
    .check {
      position: absolute;
      top: 5px; right: 5px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .page-card.selected .check { opacity: 1; }
    .check svg { width: 10px; height: 10px; }

    /* highlighted from TOC hover */
    .page-card.highlight { border-color: #f59e0b; box-shadow: 0 0 0 2px #f59e0b33; }

    /* ── Spinner ───────────────────────────────────────────── */
    #spinner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,17,23,0.82);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 999;
    }
    #spinner.visible { display: flex; }
    .spin {
      width: 44px; height: 44px;
      border: 3px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #spinner p { color: #94a3b8; font-size: 0.9rem; }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-size: 0.84rem;
      transition: transform 0.3s;
      z-index: 1000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.error   { border-color: #f87171; color: #fca5a5; }
    #toast.success { border-color: #34d399; color: #6ee7b7; }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 720px) {
      #main.visible { flex-direction: column; }
      #toc-panel { width: 100%; position: static; max-height: 280px; }
    }
  </style>
</head>
<body>

<h1>Estrai pagine PDF</h1>
<p class="subtitle">Seleziona le pagine dal tuo PDF e scaricale come nuovo documento</p>

<!-- Drop zone -->
<div id="drop-zone">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/>
    <polyline points="9 15 12 12 15 15"/>
  </svg>
  <p><strong>Trascina un PDF qui</strong><br/>oppure clicca per scegliere un file</p>
  <input type="file" id="file-input" accept="application/pdf" />
</div>

<!-- Main layout (TOC + content) -->
<div id="main">

  <!-- TOC sidebar -->
  <aside id="toc-panel">
    <div id="toc-header">
      <h2>📑 Indice</h2>
      <span id="toc-count" style="font-size:0.75rem;color:#475569"></span>
    </div>
    <div id="toc-search" style="display:none">
      <input type="text" id="toc-search-input" placeholder="Cerca nell'indice…" />
    </div>
    <div id="toc-list"></div>
    <div id="toc-empty">Nessun indice trovato in questo PDF</div>
  </aside>

  <!-- Right column -->
  <div id="right-col">

    <!-- Toolbar -->
    <div id="toolbar">
      <span id="file-name"></span>
      <div class="jump-wrap">
        <label>Pag.</label>
        <input type="number" id="jump-input" min="1" placeholder="n" />
        <button class="btn-ghost" id="jump-btn" style="padding:0.3rem 0.6rem">→</button>
      </div>
      <button class="btn-ghost" id="select-all-btn">Tutto</button>
      <button class="btn-ghost" id="deselect-btn">Nessuna</button>
      <span id="sel-count">0 pag. selezionate</span>
      <button class="btn-danger" id="new-file-btn">↩ Nuovo</button>
      <button class="btn-primary" id="extract-btn" disabled>Estrai PDF ↓</button>
    </div>

    <!-- Page grid -->
    <div id="grid"></div>

  </div>
</div>

<!-- Spinner -->
<div id="spinner">
  <div class="spin"></div>
  <p id="spinner-msg">Caricamento PDF…</p>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dropZone      = document.getElementById('drop-zone');
  const fileInput     = document.getElementById('file-input');
  const mainEl        = document.getElementById('main');
  const grid          = document.getElementById('grid');
  const spinner       = document.getElementById('spinner');
  const spinnerMsg    = document.getElementById('spinner-msg');
  const toast         = document.getElementById('toast');
  const selCount      = document.getElementById('sel-count');
  const extractBtn    = document.getElementById('extract-btn');
  const fileNameEl    = document.getElementById('file-name');
  const jumpInput     = document.getElementById('jump-input');
  const tocList       = document.getElementById('toc-list');
  const tocEmpty      = document.getElementById('toc-empty');
  const tocCount      = document.getElementById('toc-count');
  const tocSearchWrap = document.getElementById('toc-search');
  const tocSearchInput= document.getElementById('toc-search-input');

  let pdfBytes  = null;
  let pdfDoc    = null;   // pdfjsLib document
  let selected  = new Set();
  let totalPages = 0;
  let tocItems  = [];     // flat list: { title, page, depth, endPage }

  // ── Drop zone ──────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type === 'application/pdf') handleFile(f);
    else showToast('Carica un file PDF valido', 'error');
  });

  // ── Load PDF ───────────────────────────────────────────────
  async function handleFile(file) {
    if (!file) return;
    showSpinner('Caricamento PDF…');
    try {
      pdfBytes = await file.arrayBuffer();
      pdfDoc   = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
      totalPages = pdfDoc.numPages;
      selected.clear();
      grid.innerHTML = '';

      fileNameEl.textContent = file.name;
      jumpInput.max = totalPages;
      dropZone.style.display = 'none';
      mainEl.classList.add('visible');

      updateCounter();
      spinnerMsg.textContent = 'Caricamento indice…';
      await buildTOC(pdfDoc);
      spinnerMsg.textContent = 'Rendering pagine…';
      await renderThumbnails(pdfDoc);
    } catch (err) {
      showToast('Errore: ' + err.message, 'error');
    }
    hideSpinner();
  }

  // ── TOC ────────────────────────────────────────────────────
  async function buildTOC(pdf) {
    tocList.innerHTML = '';
    tocItems = [];
    const outline = await pdf.getOutline();

    if (!outline || outline.length === 0) {
      tocEmpty.style.display = '';
      tocSearchWrap.style.display = 'none';
      tocCount.textContent = '';
      return;
    }
    tocEmpty.style.display = 'none';

    // Flatten outline tree, resolve page numbers
    async function processItems(items, depth) {
      for (const item of items) {
        let pageNum = null;
        try {
          if (item.dest) {
            const dest = typeof item.dest === 'string'
              ? await pdf.getDestination(item.dest)
              : item.dest;
            if (dest && dest[0]) {
              const idx = await pdf.getPageIndex(dest[0]);
              pageNum = idx + 1;
            }
          }
        } catch (_) {}
        tocItems.push({ title: item.title || '(senza titolo)', page: pageNum, depth });
        if (item.items && item.items.length) await processItems(item.items, depth + 1);
      }
    }
    await processItems(outline, 0);

    // Compute endPage for each item (start of next sibling/parent at same or shallower depth)
    for (let i = 0; i < tocItems.length; i++) {
      let end = totalPages;
      for (let j = i + 1; j < tocItems.length; j++) {
        if (tocItems[j].depth <= tocItems[i].depth && tocItems[j].page) {
          end = tocItems[j].page - 1;
          break;
        }
      }
      tocItems[i].endPage = end;
    }

    tocCount.textContent = tocItems.length + ' voci';
    tocSearchWrap.style.display = tocItems.length > 8 ? '' : 'none';
    renderTOC(tocItems);
  }

  function renderTOC(items) {
    tocList.innerHTML = '';
    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = `toc-item depth-${Math.min(item.depth, 3)}`;

      const btn = document.createElement('button');
      btn.className = 'toc-btn';
      btn.title = item.title;
      btn.textContent = item.title;

      if (item.page) {
        const badge = document.createElement('span');
        badge.className = 'toc-page-badge';
        badge.textContent = 'p.' + item.page;
        btn.appendChild(badge);
      }

      btn.addEventListener('click', () => {
        if (item.page) {
          const card = grid.querySelector(`[data-page="${item.page}"]`);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        tocList.querySelectorAll('.toc-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });

      // Highlight range on hover
      btn.addEventListener('mouseenter', () => {
        if (!item.page) return;
        for (let p = item.page; p <= item.endPage; p++) {
          const c = grid.querySelector(`[data-page="${p}"]`);
          if (c) c.classList.add('highlight');
        }
      });
      btn.addEventListener('mouseleave', () => {
        grid.querySelectorAll('.highlight').forEach(c => c.classList.remove('highlight'));
      });

      const selBtn = document.createElement('button');
      selBtn.className = 'toc-select-btn';
      selBtn.textContent = '☑';
      selBtn.title = 'Seleziona pagine di questa sezione';
      selBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (!item.page) return;
        for (let p = item.page; p <= item.endPage; p++) {
          selected.add(p);
          const c = grid.querySelector(`[data-page="${p}"]`);
          if (c) c.classList.add('selected');
        }
        updateCounter();
        showToast(`Selezionate pag. ${item.page}–${item.endPage}`, 'success');
      });

      row.appendChild(btn);
      if (item.page) row.appendChild(selBtn);
      tocList.appendChild(row);
    });
  }

  // TOC search filter
  tocSearchInput.addEventListener('input', () => {
    const q = tocSearchInput.value.trim().toLowerCase();
    const filtered = q ? tocItems.filter(i => i.title.toLowerCase().includes(q)) : tocItems;
    renderTOC(filtered);
  });

  // ── Thumbnails ─────────────────────────────────────────────
  async function renderThumbnails(pdf) {
    const SCALE = 0.28;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp   = page.getViewport({ scale: SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.page = i;
      card.innerHTML = `<div class="check"><svg viewBox="0 0 12 10" fill="none"><polyline points="1,5 4,9 11,1" stroke="white" stroke-width="2"/></svg></div>`;
      card.prepend(canvas);

      const label = document.createElement('div');
      label.className = 'page-label';
      label.textContent = 'Pag. ' + i;
      card.appendChild(label);

      card.addEventListener('click', () => togglePage(i, card));
      grid.appendChild(card);
    }
  }

  // ── Selection ──────────────────────────────────────────────
  function togglePage(n, card) {
    selected.has(n) ? selected.delete(n) : selected.add(n);
    card.classList.toggle('selected');
    updateCounter();
  }

  document.getElementById('select-all-btn').addEventListener('click', () => {
    grid.querySelectorAll('.page-card').forEach(c => {
      selected.add(+c.dataset.page);
      c.classList.add('selected');
    });
    updateCounter();
  });

  document.getElementById('deselect-btn').addEventListener('click', () => {
    selected.clear();
    grid.querySelectorAll('.page-card').forEach(c => c.classList.remove('selected'));
    updateCounter();
  });

  function updateCounter() {
    const n = selected.size;
    selCount.textContent = n + (n === 1 ? ' pag. selezionata' : ' pag. selezionate');
    extractBtn.disabled = n === 0;
  }

  // ── Jump ───────────────────────────────────────────────────
  document.getElementById('jump-btn').addEventListener('click', jumpToPage);
  jumpInput.addEventListener('keydown', e => e.key === 'Enter' && jumpToPage());
  function jumpToPage() {
    const n = parseInt(jumpInput.value);
    if (!n || n < 1 || n > totalPages) return showToast('Numero pagina non valido', 'error');
    grid.querySelector(`[data-page="${n}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ── Extract ────────────────────────────────────────────────
  extractBtn.addEventListener('click', async () => {
    if (!selected.size) return;
    showSpinner('Estrazione in corso…');
    try {
      const { PDFDocument } = PDFLib;
      const srcDoc = await PDFDocument.load(pdfBytes);
      const newDoc = await PDFDocument.create();
      const pages  = Array.from(selected).sort((a, b) => a - b);
      for (const n of pages) {
        const [p] = await newDoc.copyPages(srcDoc, [n - 1]);
        newDoc.addPage(p);
      }
      const blob = new Blob([await newDoc.save()], { type: 'application/pdf' });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: 'pagine-estratte.pdf' });
      a.click();
      URL.revokeObjectURL(url);
      showToast(`${pages.length} pagine estratte!`, 'success');
    } catch (err) {
      showToast('Errore: ' + err.message, 'error');
    }
    hideSpinner();
  });

  // ── Reset ──────────────────────────────────────────────────
  document.getElementById('new-file-btn').addEventListener('click', () => {
    pdfBytes = null; pdfDoc = null;
    selected.clear(); totalPages = 0;
    grid.innerHTML = '';
    tocList.innerHTML = '';
    tocEmpty.style.display = '';
    tocCount.textContent = '';
    tocSearchWrap.style.display = 'none';
    tocSearchInput.value = '';
    mainEl.classList.remove('visible');
    dropZone.style.display = '';
    fileInput.value = '';
  });

  // ── Helpers ────────────────────────────────────────────────
  function showSpinner(msg) { spinnerMsg.textContent = msg; spinner.classList.add('visible'); }
  function hideSpinner() { spinner.classList.remove('visible'); }

  let toastTimer;
  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = 'show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toast.className = ''), 3000);
  }
</script>
</body>
</html>
